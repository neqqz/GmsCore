name: "Gradle build"
permissions: {}
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build:
    name: "Gradle build ${{ matrix.target }}"
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1

    strategy:
      matrix:
        target: [Release]

    steps:
      - name: "Free disk space"
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt-hostedtoolcache/go
          df -h
          
      - name: "Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
          
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          
      - name: "Setup matchers"
        run: |
          matchers_dir='${{ github.workspace }}/.github/matchers'
          matcher_list()
          {
            echo 'gradle-build-matcher.json'
            echo 'gradle-build-kotlin-error-matcher.json'
          }
          matcher_list | while IFS='' read -r NAME; do
            if test -f "${matchers_dir:?}/${NAME:?}"; then
              echo "::add-matcher::${matchers_dir:?}/${NAME:?}"
              echo "Matcher configured: ${NAME:?}"
            fi
          done
          
      - name: "Execute Gradle assemble"
        run: "./gradlew assemble${{ matrix.target }}"
        
      - name: "Execute Gradle lint"
        run: "./gradlew lint${{ matrix.target }}"
        
      - name: Load signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KS"
          printf '%s\n' "$LOCAL_PROPERTIES" | tr -d '\r' > "$RUNNER_TEMP/signing.properties"
          for k in KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
            v=$(grep -m1 "^$k=" "$RUNNER_TEMP/signing.properties" | cut -d= -f2-)
            [ -n "$v" ] || { echo "::error::$k is missing in LOCAL_PROPERTIES secret"; exit 1; }
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_ENV"
          done
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/signing.properties"

      - name: "ZipAlign"
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          mkdir outapk
          
          $ZIPALIGN -v -p 4 \
            play-services-core/build/outputs/apk/hmsDefault/release/*.apk \
            outapk/GmsCore-aligned.apk

          $ZIPALIGN -v -p 4 \
            vending-app/build/outputs/apk/default/release/*.apk \
            outapk/FakeStore-aligned.apk
          
      - name: "Sign APK with apksigner"
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          
          # Sign GmsCore
          $APKSIGNER sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ALIAS_NAME" \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:ALIAS_PASS \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out outapk/GmsCore.apk \
            outapk/GmsCore-aligned.apk
            
          # Sign FakeStore
          $APKSIGNER sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ALIAS_NAME" \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:ALIAS_PASS \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out outapk/FakeStore.apk \
            outapk/FakeStore-aligned.apk
          
      - name: "Verify signatures"
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          $APKSIGNER verify --verbose outapk/GmsCore.apk
          $APKSIGNER verify --verbose outapk/FakeStore.apk
          
      - name: "Upload gms artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: signed-gms-apk
          path: outapk/GmsCore.apk
          
      - name: "Upload FakeStore artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: signed-vending-apk
          path: outapk/FakeStore.apk
          
      - name: "Upload build reports"
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.target }}-${{ github.sha }}
          path: |
            **/build/reports/**/*
            **/build/outputs/lint-results*.xml
          retention-days: 7
